name: PharmaCare Android CI and APK

on:
  push:
    branches:
      - main
      - fix/pharmacare-reliability-oct24
    paths:
      - 'pharmacare/**'
      - '.github/workflows/pharmacare-android.yml'
  pull_request:
    paths:
      - 'pharmacare/**'
      - '.github/workflows/pharmacare-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pharmacare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: pharmacare

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pharmacare-android-apk-${{ github.run_number }}
          path: pharmacare/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pharmacare-build-info-${{ github.run_number }}
          path: |
            pharmacare/pubspec.yaml
            pharmacare/pubspec.lock
          retention-days: 14
